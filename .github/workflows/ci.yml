name: ci
on: [push, pull_request]
jobs:
  layers:
    # Assembler encodings vs GNU as, then the kernel and the Scheme on QEMU netduinoplus2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: forthlisp-stm32 }
      - uses: actions/checkout@v4
        with: { repository: equwal/forthlisp, path: forthlisp }
      - run: sudo apt-get update && sudo apt-get install -y sbcl qemu-system-arm binutils-arm-none-eabi
      - run: cd forthlisp-stm32 && sh test.sh
  r7rs-suite:
    # chibi-scheme's R7RS suite on the emulated chip (about 10 minutes); counts in results.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: forthlisp-stm32 }
      - uses: actions/checkout@v4
        with: { repository: equwal/forthlisp, path: forthlisp }
      - run: sudo apt-get update && sudo apt-get install -y sbcl qemu-system-arm binutils-arm-none-eabi
      - run: cd forthlisp-stm32 && SUITE=1 sh test.sh
      - run: head -1 forthlisp/tests/r7rs/results.txt
